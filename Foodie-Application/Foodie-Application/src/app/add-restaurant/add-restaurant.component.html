<app-header></app-header>
<div>
    <section class="h-100 h-custom" style="background-color: #8fc4b7;">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col-lg-8 col-xl-6">
                    <div class="card rounded-3">
                        <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/img3.webp"
                            class="w-100" style="border-top-left-radius: .3rem; border-top-right-radius: .3rem;"
                            alt="Sample photo">
                        <div class="card-body p-4 p-md-5">
                            <h3 class="mb-4 pb-2 pb-md-0 mb-md-5 px-md-2"><strong>Restaurant Info</strong></h3>

                            <form class="px-md-2" (ngSubmit)="addRestaurant()">

                                <div class="responsive-textfield-black-outline">
                                    <label class="form-label" for="form3Example1q">Restaurant Name</label>
                                    <input type="text" id="form3Example1q" class="form-control"
                                        [(ngModel)]="restaurant.restaurantName" name="name" required minlength="2" maxlength="15" #name="ngModel"/>
                                        <span *ngIf="name.invalid && (name.dirty || name.touched)">
                                            <span *ngIf="name?.errors?.['required']"><mat-error>Restaurant name is required.</mat-error></span>
                                            <span  *ngIf="name?.errors?.['minlength']"><mat-error>Restaurant name must be at least 2 characters long.</mat-error></span>
                                            <span *ngIf="name?.errors?.['maxlength']"><mat-error>Restaurant name cannot be more than 15 characters long.</mat-error></span>
                                        </span>                        
                                </div>
                                <div class="responsive-textfield-black-outline">
                                    <label for="locationSelect">City</label>
                                    <select class="form-control" id="locationSelect" (change)="onLocationChange($event)"
                                    [(ngModel)]="restaurant.restaurantLocation" name="city" required #city="ngModel">
                                        <option selected disabled> Select a location</option>
                                        <option value="Bulandshahr">Bulandshahr</option>
                                        <option value="Delhi">Delhi</option>
                                        <option value="Karnataka">Karnataka</option>
                                    </select>
                                    <span *ngIf="city.invalid && (city.dirty || city.touched)">
                                        <span *ngIf="city?.errors?.['required']"><mat-error>Please select a city</mat-error></span>                                       
                                    </span> 
                                </div>
                                <div class="responsive-textfield-black-outline">
                                    <label class="form-label" for="form3ExampleFile">Restaurant Image</label>
                                    <input type="file" id="form3ExampleFile" class="form-control"
                                        (change)="uploadImage($event)" />
                                </div>
                                <hr>
                                <button type="submit" class="btn btn-success btn-lg mb-1">Submit</button>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
