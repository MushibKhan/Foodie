<div class="row mt-3 mx-3" style="background: linear-gradient(to right, #3931af, #00c6ff);">
  <div class="col-md-3">
    <div style="margin-top: 50px; margin-left: 10px;" class="text-center">
      <i id="animationDemo" data-mdb-animation="slide-right" data-mdb-toggle="animation"
        data-mdb-animation-reset="true" data-mdb-animation-start="onScroll"
        data-mdb-animation-on-scroll="repeat" class="fas fa-3x fa-truck text-white"></i>
      <h3 class="mt-3 text-white">Welcome</h3>
    </div>
    <div class="text-center">
      <button type="submit" class="btn btn-white btn-rounded back-button" routerLink="/cart">Go back</button>
    </div>


  </div>
  <div class="col-md-9 justify-content-center">
    <div class="card card-custom pb-4">
      <div class="card-body mt-0 mx-5">
        <div class="text-center mb-3 pb-2 mt-3">
          <h4 style="color: #495057 ;">Address Details</h4>
        </div>

        <form class="mb-0">

          <div class="row mb-4">
            <div class="col">
              <div class="form-outline">
                <label class="form-label" for="form9Example1">House/flate Number</label>
                <input type="text" id="form9Example1" class="form-control input-custom" [(ngModel)]="address.houseNumber" name="houseNumber" />
              </div>
            </div>
            <div class="col">
              <div class="form-outline">
                <label class="form-label" for="form9Example2">Area</label>
                <input type="text" id="form9Example2" class="form-control input-custom" [(ngModel)]="address.street" name="street"/>
              </div>
            </div>
          </div>
          <div class="row mb-4">
            <div class="col">
              <div class="form-outline">
                <label for="locationSelect">City</label>
                <select class="form-control" id="locationSelect"  (change)="onLocationChange($event)" name="city">
                  <option selected disabled> Select a location</option>
                  <option value="Bulandshahr">Bulandshahr</option>
                  <option value="Delhi">Delhi</option>
                  <option value="Karnataka">Karnataka</option>
                </select>
              </div>
            </div>
            <div class="col">
              <div class="form-outline">
                <label class="form-label" for="form9Example4">Pincode</label>
                <input type="number" id="form9Example4" class="form-control input-custom" [(ngModel)]="address.pinCode" name="pincode"/>
              </div>
            </div>
          </div>

          <div class="float-end ">
            <!-- Submit button -->
            <button type="submit" class="btn btn-primary btn-rounded"
            style="background-color: #0062CC ;" (click)="addAddress()" >Add-Address</button>
        </div>

      </form>
    </div>
  </div>
</div>
</div>
